[build-system]
requires = ['maturin>=1.12,<2']
build-backend = 'maturin'

[project]
name = 'skribblpy'
version = '0.1.0'
description = 'Async skribbl.io framework with decorator-based events and drawing tools'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.14'
dependencies = ['aiohttp>=3.12,<4']
keywords = ['skribbl', 'asyncio', 'drawing', 'bots']
classifiers = [
    'Development Status :: 3 - Alpha',
    'Framework :: AsyncIO',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: Implementation :: CPython',
    'Programming Language :: Rust',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX :: Linux',
    'Operating System :: MacOS',
    'Typing :: Typed',
]

[project.urls]
Repository = 'https://github.com/skribblpy/skribblpy'
Issues = 'https://github.com/skribblpy/skribblpy/issues'
Documentation = 'https://github.com/skribblpy/skribblpy#readme'
Releases = 'https://github.com/skribblpy/skribblpy/releases'

[project.optional-dependencies]
images = ['numpy>=2.2,<3']
cli = ['argly>=0.1,<1', 'numpy>=2.2,<3']
dev = ['mypy>=1.18.2,<2', 'pytest-cov>=7,<8', 'pytest>=8.4,<10', 'pytest-asyncio>=1.1,<2', 'ruff>=0.12,<1', 'Pillow>=11.3,<14']
release = ['maturin>=1.15,<2', 'twine>=7,<8', 'argly>=0.1,<1']

[tool.maturin]
manifest-path = 'native/Cargo.toml'
python-source = 'src'
module-name = 'skribblpy._image_native'
bindings = 'pyo3'
locked = true
include = [
    { path = 'tests/**/*', format = 'sdist' },
    { path = 'examples/**/*.py', format = 'sdist' },
    { path = 'examples/word_guesser/words*.json', format = 'sdist' },
    { path = 'validation/**/*', format = 'sdist' },
    { path = 'benchmarks/**/*.py', format = 'sdist' },
    { path = 'rust-toolchain.toml', format = 'sdist' },
]
exclude = ['**/__pycache__/**', '**/*.pyc', '**/*.pdb', '**/*.lock.tmp']

[project.scripts]
skribbl-image = 'skribblpy.cli:main'

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']

[tool.coverage.run]
patch = ['subprocess']

[tool.mypy]
python_version = '3.14'
files = ['src/skribblpy']
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
target-version = 'py314'
line-length = 100

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'B', 'ASYNC']

[tool.ruff.format]
quote-style = 'single'
