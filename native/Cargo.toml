[package]
name = 'skribblpy-images'
version = '0.1.0'
edition = '2024'
license = 'MIT'
description = 'Native raster decoding, rendering, and drawing planning for skribblpy'
repository = 'https://github.com/skribblpy/skribblpy'
publish = false

[lib]
name = '_image_native'
crate-type = ['cdylib']

[dependencies]
pyo3 = { version = '0.29.2', features = ['abi3-py314'] }
image = { version = '0.25.10', default-features = false, features = ['png', 'jpeg', 'gif'] }

[profile.release]
lto = 'thin'
codegen-units = 1
strip = true
